<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><rect x="0" y="0" width="1200" height="520" fill="#f4f7fc" stroke="none" stroke-width="1"/><defs><marker id="ah64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ah0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ah1a7f4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f4b"/></marker></defs><text x="40" y="52" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Diffusion as the drafter (lossless speculative decoding)</text><text x="40" y="80" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">A cheap proposal is checked by the full LLM in one forward pass. It keeps exactly the tokens it would have written itself.</text><rect x="40" y="120" width="470" height="290" fill="#ffffff" stroke="#dbe2ee" stroke-width="1.2"/><text x="64" y="148" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Propose: copy when the old code matches, else draft</text><rect x="64" y="166" width="422" height="96" fill="#eef1f6" stroke="#d5dbe5" stroke-width="1"/><text x="84" y="192" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Copy from the input</text><text x="84" y="214" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">the current text also appears in the input</text><text x="84" y="233" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">(≥ 8-token match) → copy up to 63 tokens</text><rect x="84" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="109" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="134" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="159" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="184" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="209" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="234" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="259" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="284" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="309" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="334" y="242" width="22" height="12" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="64" y="278" width="422" height="112" fill="#e3f6ee" stroke="#bfe6d4" stroke-width="1"/><text x="84" y="304" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f7a54" text-anchor="start">DFlash diffusion drafter</text><text x="84" y="326" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">small block-diffusion model reads the LLM’s</text><text x="84" y="345" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">hidden states, drafts 16 tokens in ONE pass</text><rect x="84" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="109" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="134" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="159" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="184" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="209" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="234" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="259" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="284" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="309" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="334" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="359" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="384" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="409" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="434" y="360" width="22" height="12" fill="#1baf7a" stroke="none" stroke-width="1"/><line x1="512" y1="265" x2="586" y2="265" stroke="#0f172a" stroke-width="1.8" marker-end="url(#ah0f172a)"/><rect x="590" y="190" width="250" height="150" fill="#e6eefc" stroke="#c9d8f5" stroke-width="1.2"/><text x="715.0" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">Target LLM</text><text x="715.0" y="242" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">verifies the whole block</text><text x="715.0" y="261" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">in a single forward pass</text><text x="715.0" y="280" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">(Qwen3-8B, Qwen2.5-0.5B …)</text><line x1="842" y1="265" x2="906" y2="265" stroke="#0f172a" stroke-width="1.8" marker-end="url(#ah0f172a)"/><rect x="910" y="170" width="250" height="190" fill="#ffffff" stroke="#dbe2ee" stroke-width="1.2"/><text x="1035" y="200" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Keep the agreeing prefix</text><rect x="934" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="947" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="960" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="973" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="986" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="999" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="1012" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="1025" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="1038" y="218" width="11" height="22" fill="#1a7f4b" stroke="none" stroke-width="1"/><rect x="1051" y="218" width="11" height="22" fill="#e11d48" stroke="none" stroke-width="1"/><rect x="1064" y="218" width="11" height="22" fill="#cbd5e1" stroke="none" stroke-width="1"/><rect x="1077" y="218" width="11" height="22" fill="#cbd5e1" stroke="none" stroke-width="1"/><rect x="1090" y="218" width="11" height="22" fill="#cbd5e1" stroke="none" stroke-width="1"/><rect x="1103" y="218" width="11" height="22" fill="#cbd5e1" stroke="none" stroke-width="1"/><rect x="1116" y="218" width="11" height="22" fill="#cbd5e1" stroke="none" stroke-width="1"/><rect x="1129" y="218" width="11" height="22" fill="#cbd5e1" stroke="none" stroke-width="1"/><text x="1035" y="266" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">+ 1 token from the LLM itself</text><text x="1035" y="292" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">output = the LLM’s own</text><text x="1035" y="312" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">greedy output (lossless)</text><path d="M1035,362 L1035,440 L275,440 L275,412" fill="none" stroke="#1a7f4b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah1a7f4b)"/><text x="655" y="432" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1a7f4b" text-anchor="middle">next step starts after the accepted tokens</text><rect x="40" y="458" width="1120" height="46" fill="#ffffff" stroke="#dbe2ee" stroke-width="1.2"/><text x="64" y="487" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Text-to-SQL, Qwen2.5-0.5B + DFlash:</text><text x="318" y="487" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1a7f4b" text-anchor="start">2.0× faster</text><text x="460" y="487" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Code edits, Qwen3-8B, copy + DFlash:</text><text x="712" y="487" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1a7f4b" text-anchor="start">9.0× faster</text><text x="1136" y="487" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="end">measured end to end in vLLM, batch 1</text></svg>
