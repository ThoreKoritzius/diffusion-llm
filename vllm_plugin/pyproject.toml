[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-modernbert-decoder"
version = "0.1.0"
description = "vLLM support for ModernBertDecoderForCausalLM (Ettin decoder models)"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
modernbert_decoder = "vllm_modernbert_decoder:register"

[tool.setuptools]
packages = ["vllm_modernbert_decoder"]
